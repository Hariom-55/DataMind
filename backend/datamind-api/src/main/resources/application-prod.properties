# DataMind production profile
# Activate with: SPRING_PROFILES_ACTIVE=prod
# All deployment-specific values are supplied through environment variables.

spring.application.name=datamind-api
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

datamind.python.base-url=${DATAMIND_PYTHON_BASE_URL}
datamind.python.internal-api-key=${DATAMIND_INTERNAL_API_KEY}
datamind.python.connect-timeout=${DATAMIND_PYTHON_CONNECT_TIMEOUT:5s}
datamind.python.read-timeout=${DATAMIND_PYTHON_READ_TIMEOUT:10m}
datamind.python.health-check-timeout=${DATAMIND_PYTHON_HEALTH_CHECK_TIMEOUT:3s}
datamind.health.python.enabled=${DATAMIND_HEALTH_PYTHON_ENABLED:true}

datamind.cors.allowed-origins=${DATAMIND_CORS_ALLOWED_ORIGINS}

datamind.jobs.worker-delay=${DATAMIND_JOBS_WORKER_DELAY:5s}
datamind.jobs.stale-after=${DATAMIND_JOBS_STALE_AFTER:30m}
datamind.jobs.max-retries=${DATAMIND_JOBS_MAX_RETRIES:3}

datamind.dataset.storage-path=${DATAMIND_DATASET_STORAGE_PATH}
datamind.dataset.max-file-size=${DATAMIND_DATASET_MAX_FILE_SIZE:50MB}
datamind.dataset.allowed-extensions=${DATAMIND_DATASET_ALLOWED_EXTENSIONS:csv,xlsx,xls,json,parquet}

spring.servlet.multipart.max-file-size=${DATAMIND_DATASET_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${DATAMIND_DATASET_MAX_FILE_SIZE:50MB}

# Spring Boot Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.level.com.datamind.datamind_api=INFO
