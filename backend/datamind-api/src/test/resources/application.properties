spring.application.name=datamind-api-test

spring.datasource.url=jdbc:postgresql://localhost:5432/datamind_test
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

datamind.python.base-url=http://127.0.0.1:8000

logging.level.com.datamind.datamind_api.analysis.config=DEBUG

datamind.dataset.storage-path=./data/datasets