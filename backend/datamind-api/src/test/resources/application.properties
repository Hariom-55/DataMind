spring.application.name=datamind-api-test

spring.datasource.url=jdbc:postgresql://localhost:5432/datamind_test
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Keep the test profile explicit so configuration-bound services can be instantiated consistently.
datamind.python.base-url=http://127.0.0.1:8000
datamind.python.connect-timeout=5s
datamind.python.read-timeout=10m

datamind.jobs.worker-delay=5s
datamind.jobs.stale-after=30m
datamind.jobs.max-retries=3

datamind.dataset.storage-path=./data/datasets
datamind.dataset.max-file-size=50MB
datamind.dataset.allowed-extensions=csv,xlsx,xls,json,parquet

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
