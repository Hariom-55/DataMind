name: DataMind CI

on:
  push:
    branches: [ "main", "deployment-v1" ]
  pull_request:
    branches: [ "main", "deployment-v1" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/datamind-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/datamind-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit & component tests
        run: npm test

      - name: Run production build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.datamind.example.com

  analytics-check:
    name: Analytics Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        run: python -m pytest -v
        env:
          DATAMIND_INTERNAL_API_KEY: ci-test-internal-key
          PYTHONPATH: .

  backend-check:
    name: Backend API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datamind_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up Python for Analytics Service
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install Analytics dependencies
        working-directory: analytics
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI Analytics Service in Background
        working-directory: analytics
        env:
          DATAMIND_INTERNAL_API_KEY: datamind-test-internal-key
          PYTHONPATH: .
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000/health | grep -q "UP"; do sleep 1; done'

      - name: Make Maven wrapper executable
        working-directory: backend/datamind-api
        run: chmod +x mvnw

      - name: Run Maven tests
        working-directory: backend/datamind-api
        run: ./mvnw -B test
        env:
          DB_PASSWORD: postgres
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/datamind_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          DATAMIND_INTERNAL_API_KEY: datamind-test-internal-key

  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Analytics Container
        uses: docker/build-push-action@v5
        with:
          context: analytics
          file: analytics/Dockerfile
          push: false
          tags: datamind-analytics:ci

      - name: Build Spring Boot API Container
        uses: docker/build-push-action@v5
        with:
          context: backend/datamind-api
          file: backend/datamind-api/Dockerfile
          push: false
          tags: datamind-api:ci
